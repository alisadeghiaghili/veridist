[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veridist"
version = "1.0.1"
description = "Evidence-first distribution fitting with explicit execution contracts"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com" },
]
requires-python = ">=3.11"
keywords = [
    "reliability",
    "survival-analysis",
    "lifetime-data",
    "right-censoring",
    "distribution-fitting",
    "maximum-likelihood",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/veridist"
Documentation = "https://github.com/alisadeghiaghili/veridist/tree/main/python/docs"
Repository = "https://github.com/alisadeghiaghili/veridist"
Issues = "https://github.com/alisadeghiaghili/veridist/issues"

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6",
    "mpmath==1.3.0",
    "PyYAML>=6,<7",
    "pytest>=8.3",
    "pytest-cov>=6,<8",
]
mutation = [
    "mutmut==3.7.0",
    "pytest>=8.3",
]
browser = [
    "playwright==1.62.0",
]
lint = [
    "mypy>=1.13",
    "ruff>=0.8",
]
docs = [
    "Sphinx>=8.2,<9",
    "myst-parser>=4,<5",
    "sphinx-intl>=2.3,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veridist = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["veridist"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# This is intentionally the complete binding critical production scope.  Do not
# add exclusion keys here: the evidence checker rejects them.
[tool.mutmut]
source_paths = [
    "src/veridist/domain",
    "src/veridist/statistics",
    "src/veridist/families",
    "src/veridist/engine",
]
# Mutation evidence must exercise every test layer that specifies a critical
# production operation.  The distribution-operation contracts live in the
# conformance and property suites rather than the legacy unit directories.
pytest_add_cli_args_test_selection = [
    "tests/contract",
    "tests/reference",
    "tests/unit",
    "tests/conformance",
    "tests/property",
]
also_copy = [
    "tools",
    "src/veridist/__init__.py",
    "src/veridist/execution.py",
    "src/veridist/inference.py",
    "src/veridist/py.typed",
    "src/veridist/adapters",
    "src/veridist/reporting",
]
mutate_only_covered_lines = false
