{% set name = "veridist" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/alisadeghiaghili/veridist/releases/download/v{{ version }}/veridist-{{ version }}.tar.gz
  sha256: 403cff8bcfb78b08b74b1b5cc87adbd80e0130fe3e519d9f2fa9e250108a0878

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python >=3.11
    - setuptools >=77
  run:
    - numpy >=1.26,<3
    - python >=3.11

test:
  imports:
    - veridist

about:
  home: https://github.com/alisadeghiaghili/veridist
  license: BUSL-1.1
  license_file: LICENSE
  summary: Evidence-first distribution fitting with explicit execution contracts

extra:
  recipe-maintainers:
    - alisadeghiaghili
