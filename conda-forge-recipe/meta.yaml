{% set name = "veridist" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/alisadeghiaghili/veridist/releases/download/v{{ version }}/veridist-{{ version }}.tar.gz
  sha256: 8e634b96a263c0bc0835c81a83e561e9e46b346b1d6c312af9650a2ec8ec188e

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python >=3.11
    - setuptools >=77
  run:
    - numpy >=1.26,<3
    - python >=3.11

test:
  imports:
    - veridist

about:
  home: https://github.com/alisadeghiaghili/veridist
  license: BUSL-1.1
  license_file: LICENSE
  summary: Evidence-first distribution fitting with explicit execution contracts

extra:
  recipe-maintainers:
    - alisadeghiaghili
