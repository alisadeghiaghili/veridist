name: veridist-release-validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact full lowercase Git commit SHA to validate
        required: true
        type: string
      release_tag:
        description: Exact v-prefixed package version to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: veridist / release validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind requested candidate and tag to package version
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate_sha }}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate SHA must be a full lowercase Git commit" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$candidate" || { echo "checked-out candidate SHA differs from requested candidate SHA" >&2; exit 1; }
          test -z "$(git status --porcelain)" || { echo "release candidate checkout is dirty" >&2; exit 1; }
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${{ inputs.release_tag }}" = "v$version" || { echo "release tag does not match package version" >&2; exit 1; }
      - name: Build and inspect distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7" "PyYAML>=6,<7" \
            "setuptools==84.0.0" "wheel==0.48.0"
          release_epoch="$(python -c 'import datetime, json; value=json.load(open("../.zenodo.json", encoding="utf-8"))["publication_date"]; print(int(datetime.datetime.fromisoformat(value).replace(tzinfo=datetime.timezone.utc).timestamp()))')"
          python tools/build_reproducible.py --project . --output dist-a --epoch "$release_epoch"
          python tools/build_reproducible.py --project . --output dist-b --epoch "$release_epoch"
          cmp dist-a/*.whl dist-b/*.whl
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          mkdir dist
          cp dist-a/* dist/
          python -m twine check dist/*
          python tools/check_release_metadata.py --repository-root .. --sdist dist/*.tar.gz
          python tools/check_release_artifacts.py \
            --project-root . \
            --release-tag "${{ inputs.release_tag }}" \
            --artifact dist/*.whl \
            --artifact dist/*.tar.gz
      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/veridist-release-wheel"
          "$RUNNER_TEMP/veridist-release-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/veridist-release-wheel/bin/python" -c 'import importlib.metadata as metadata; import veridist; assert metadata.version("veridist") == veridist.__version__'
      - name: Retain validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veridist-${{ inputs.release_tag }}-${{ inputs.candidate_sha }}
          path: python/dist
          retention-days: 90
