name: veridist-scale-evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase Git commit SHA to measure
        required: true
        type: string

permissions:
  checks: read
  contents: read

jobs:
  preflight:
    name: veridist / scale preflight
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        name: Bind the requested candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          requested="$CANDIDATE_SHA"
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate SHA must be a full lowercase Git commit" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$requested" ]]; then
            echo "checked-out candidate SHA differs from requested candidate SHA" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "refusing scale evidence from a dirty checkout" >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Verify required candidate checks
        shell: bash
        env:
          CHECK_RUNS: ${{ runner.temp }}/candidate-check-runs.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          gh api "/repos/${GITHUB_REPOSITORY}/commits/${candidate}/check-runs?per_page=100" > "$CHECK_RUNS"
          python -c 'import json, os, sys; required={"veridist / gate", "legacy / gate", "mutation / gate"}; payload=json.loads(open(os.environ["CHECK_RUNS"], encoding="utf-8").read()); completed={}; [completed.setdefault(item.get("name"), item.get("conclusion")) for item in payload.get("check_runs", []) if item.get("name") in required]; ok=completed == {name: "success" for name in required}; print("required candidate checks did not pass: " + repr(completed), file=sys.stderr) if not ok else None; sys.exit(0 if ok else 1)'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Verify evidence runners and validators before measurement
        run: >
          python -m unittest
          tests.scale.test_log_likelihood_scale_evidence
          tests.scale.test_csv_exponential_evidence
          tests.quality.test_scale_evidence_workflow -v

  scale-evidence:
    name: veridist / scale evidence (${{ matrix.os }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify candidate binding and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ needs.preflight.outputs.candidate_sha }}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$candidate"
          test -z "$(git status --porcelain)"
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Generate 10k, 100k, and 1m public-stream likelihood evidence
        run: >
          python tools/run_log_likelihood_scale_evidence.py
          --output "${{ runner.temp }}/likelihood-scale-evidence.json"
      - name: Validate candidate-bound likelihood evidence
        run: >
          python tools/check_log_likelihood_scale_evidence.py
          --artifact "${{ runner.temp }}/likelihood-scale-evidence.json"
          --expected-git-sha "${{ needs.preflight.outputs.candidate_sha }}"
          --repo-root ..
      - name: Generate 10k, 100k, and 1m strict CSV exponential evidence
        run: >
          python tools/run_scale_csv_exponential_evidence.py
          --output "${{ runner.temp }}/csv-exponential-scale-evidence.json"
      - name: Validate candidate-bound CSV exponential evidence
        run: >
          python tools/check_scale_csv_exponential_evidence.py
          --artifact "${{ runner.temp }}/csv-exponential-scale-evidence.json"
          --expected-git-sha "${{ needs.preflight.outputs.candidate_sha }}"
          --repo-root ..
      - name: Retain scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale-evidence-${{ matrix.os }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/likelihood-scale-evidence.json
            ${{ runner.temp }}/csv-exponential-scale-evidence.json
          if-no-files-found: warn

  scale-evidence-gate:
    name: veridist / scale evidence gate
    needs: [scale-evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce both platform measurements
        shell: bash
        env:
          SCALE_EVIDENCE_RESULT: ${{ needs.scale-evidence.result }}
        run: |
          set -euo pipefail
          if [[ "$SCALE_EVIDENCE_RESULT" != "success" ]]; then
            echo "candidate-bound cross-platform scale evidence did not succeed" >&2
            exit 1
          fi
