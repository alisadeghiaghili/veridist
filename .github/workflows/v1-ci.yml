name: veridist-ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: veridist / static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install lint and type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: Lint
        run: python -m ruff check src tests docs tools
      - name: Type check
        run: python -m mypy src

  tests:
    name: veridist / tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,arrow]"
      - name: Test with branch coverage
        run: >
          python -m pytest --cov=veridist --cov-branch
          --ignore=tests/docs/test_docs_toolchain.py
          --cov-report=json:coverage.json
      - name: Enforce coverage gates
        run: >
          python tools/check_coverage.py --project-root .
          --manifest quality/coverage-manifest.json
          --coverage-json coverage.json

  tests-os:
    name: veridist / tests (${{ matrix.os }}, 3.12)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,arrow]"
      - name: Test on a non-Linux platform
        run: python -m pytest --ignore=tests/docs/test_docs_toolchain.py

  package:
    name: veridist / package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build --sdist --wheel
          python -m twine check dist/*
      - name: Verify built distributions remain legacy-isolated
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(dist/*.whl dist/*.tar.gz)
          test "${#artifacts[@]}" -eq 2
          for artifact in "${artifacts[@]}"; do test -f "$artifact"; done
          python tools/check_legacy_isolation.py \
            --artifact "${artifacts[0]}" --artifact "${artifacts[1]}"
      - name: Install and inspect the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/veridist-wheel"
          "$RUNNER_TEMP/veridist-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/veridist-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/veridist-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/veridist-wheel/bin/python" -c "import importlib.metadata as metadata; import importlib.resources as resources; import veridist; assert metadata.version('veridist') == veridist.__version__ == '2.1.0'; assert resources.files('veridist').joinpath('py.typed').is_file()"
          "$RUNNER_TEMP/veridist-wheel/bin/python" - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from veridist import CsvLifetimeLimits, CsvLifetimeSchema, PublicSourceId, fit_exponential_csv
          from veridist.families import ExponentialFitSuccess
          from veridist.reporting import ReportLocale, render_exponential_report

          with TemporaryDirectory() as directory:
              source = Path(directory) / "lifetimes.csv"
              source.write_text("time,event_observed\n1,1\n1,0\n", encoding="utf-8")
              result = fit_exponential_csv(
                  source,
                  schema=CsvLifetimeSchema("time", "event_observed"),
                  source_id=PublicSourceId("src_0123456789abcdef0123456789abcdef"),
                  limits=CsvLifetimeLimits(4096, 4096),
              )
          fit = result.fit
          assert isinstance(fit, ExponentialFitSuccess)
          assert fit.rate == 0.5
          assert fit.inference == 'not_provided'
          assert fit.censoring_assumption == 'independent_right_censoring'
          report = render_exponential_report(fit, ReportLocale.FA)
          assert 'lang="fa" dir="rtl"' in report
          PY

  docs:
    name: veridist / docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,test]"
      - name: Validate catalogs and executable examples
        run: |
          python -m unittest discover -s tests/docs -p "test_*.py" -v
          python docs/toolchain.py check
      - name: Build gettext and all required locales
        run: |
          sphinx-build -b gettext -W -n docs/source docs/_build/gettext
          sphinx-build -b html -W -n docs/source docs/_build/en/html -D language=en
          sphinx-build -b html -W -n docs/source docs/_build/fa/html -D language=fa
          sphinx-build -b html -W -n docs/source docs/_build/de/html -D language=de
      - name: Check links and rendered locale direction
        run: |
          sphinx-build -b linkcheck -W -n docs/source docs/_build/linkcheck -D language=en
          python docs/toolchain.py render docs/_build/en/html en
          python docs/toolchain.py render docs/_build/fa/html fa
          python docs/toolchain.py render docs/_build/de/html de
      - name: Retain rendered documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veridist-documentation
          path: |
            python/docs/_build/en/html
            python/docs/_build/fa/html
            python/docs/_build/de/html
            python/docs/_build/linkcheck
          if-no-files-found: warn

  browser-rtl:
    name: veridist / browser rtl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Cache pinned Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,browser,docs]"
          python -m playwright install --with-deps chromium
      - name: Verify report and built Sphinx locale pages in Chromium
        env:
          VERIDIST_BROWSER_TESTS: "1"
          VERIDIST_BROWSER_ARTIFACT_DIR: artifacts/browser-rtl
        run: >
          python -m unittest tests.browser.test_exponential_report_rtl
          tests.browser.test_sphinx_rtl_pages -v
      - name: Verify exact screenshot evidence set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t screenshots < <(find artifacts/browser-rtl -maxdepth 1 -type f -name '*.png' -size +0c -print | sort)
          test "${#screenshots[@]}" -eq 4
          test "$(find artifacts/browser-rtl -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 4
          test "$(basename "${screenshots[0]}")" = "exponential-report-fa-failure.png"
          test "$(basename "${screenshots[1]}")" = "exponential-report-fa-success.png"
          test "$(basename "${screenshots[2]}")" = "sphinx-api-fa.png"
          test "$(basename "${screenshots[3]}")" = "sphinx-index-fa.png"
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veridist-browser-rtl
          path: python/artifacts/browser-rtl
          if-no-files-found: warn

  veridist-gate:
    name: veridist / gate
    needs: [static, tests, tests-os, package, docs, browser-rtl]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate result
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          TEST_OS_RESULT: ${{ needs.tests-os.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BROWSER_RTL_RESULT: ${{ needs.browser-rtl.result }}
        run: |
          set -euo pipefail
          for result in "$STATIC_RESULT" "$TEST_RESULT" "$TEST_OS_RESULT" "$PACKAGE_RESULT" "$DOCS_RESULT" "$BROWSER_RTL_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "required Veridist validation did not succeed" >&2
              exit 1
            fi
          done
