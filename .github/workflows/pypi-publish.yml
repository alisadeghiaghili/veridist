name: publish-veridist-to-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish verified release artifacts
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" = 1

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" ".[test]" "setuptools==84.0.0" "wheel==0.48.0"

      - name: Rebuild distributions deterministically for verification
        run: |
          set -euo pipefail
          release_epoch="$(python -c 'import datetime, json; value=json.load(open("../.zenodo.json", encoding="utf-8"))["publication_date"]; print(int(datetime.datetime.fromisoformat(value).replace(tzinfo=datetime.timezone.utc).timestamp()))')"
          python tools/build_reproducible.py --project . --output dist-rebuilt --epoch "$release_epoch"

      - name: Verify downloaded artifacts match the rebuilt distributions byte-for-byte
        run: |
          set -euo pipefail
          downloaded_wheel="$(find dist -maxdepth 1 -name '*.whl' -type f)"
          downloaded_sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -type f)"
          rebuilt_wheel="$(find dist-rebuilt -maxdepth 1 -name '*.whl' -type f)"
          rebuilt_sdist="$(find dist-rebuilt -maxdepth 1 -name '*.tar.gz' -type f)"
          test "$(sha256sum "$downloaded_wheel" | awk '{print $1}')" = "$(sha256sum "$rebuilt_wheel" | awk '{print $1}')"
          test "$(sha256sum "$downloaded_sdist" | awk '{print $1}')" = "$(sha256sum "$rebuilt_sdist" | awk '{print $1}')"

      - name: Validate release metadata and artifact payloads
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -type f)"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -type f)"
          python tools/check_release_metadata.py --repository-root .. --sdist "$sdist"
          python tools/check_release_artifacts.py \
            --project-root . --release-tag "$RELEASE_TAG" \
            --artifact "$wheel" --artifact "$sdist"
          python tools/check_legacy_isolation.py --artifact "$wheel" --artifact "$sdist"

      - name: Require passing CI and mutation evidence for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse HEAD)"
          for workflow in v1-ci.yml mutation.yml; do
            count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$tag_sha" --status success --json databaseId --jq 'length')"
            if [[ "$count" -lt 1 ]]; then
              echo "no successful $workflow run found for commit $tag_sha;" \
                "dispatch it manually (mutation.yml accepts workflow_dispatch) and retry the release" >&2
              exit 1
            fi
          done

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          packages-dir: python/dist
